<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 657" role="img" aria-labelledby="title desc">
  <title id="title">CİTEM half-owl eye mark</title>
  <desc id="desc">A sharp half-owl face with one glowing amber eye.</desc>
  <defs>
