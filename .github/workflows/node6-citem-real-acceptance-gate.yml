name: NODE-6 CITEM real acceptance gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  dispatch-and-wait:
    if: github.head_ref == 'agent/techint-internet-infrastructure-lane'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Dispatch real RIPE acceptance on the PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: agent/techint-internet-infrastructure-lane
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run node6-citem-real-acceptance.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${TARGET_BRANCH}"

          run_id=""
          for attempt in $(seq 1 30); do
            run_id="$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow node6-citem-real-acceptance.yml \
              --branch "${TARGET_BRANCH}" \
              --event workflow_dispatch \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            if [ -n "${run_id}" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "${run_id}" ]; then
            echo "Could not resolve dispatched acceptance run"
            exit 1
          fi

          echo "Watching acceptance run ${run_id}"
          gh run watch "${run_id}" --repo "${GITHUB_REPOSITORY}" --exit-status
