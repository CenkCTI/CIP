name: NODE-6 CITEM real RIPE acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node6-citem-real-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-ripe-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: baykush
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d baykush"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/baykush
      BAYKUSH_NODE_BASE_URL: http://127.0.0.1:18080
      BAYKUSH_NODE_TIMEOUT_MS: "9000"
      RUN_NODE6_LIVE_INTEGRATION: "true"
      NODE6_PRODUCER_REF: agent/node6-3-citem-consumer-contract

    steps:
      - name: Check out CITEM consumer branch
        uses: actions/checkout@v4
        with:
          path: citem

      - name: Check out NODE-6.3 producer branch
        uses: actions/checkout@v4
        with:
          repository: CenkCTI/BAYKUSH-Intel-Node
          ref: agent/node6-3-citem-consumer-contract
          path: node
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate ephemeral acceptance credential and paths
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::${token}"
          echo "BAYKUSH_NODE_API_TOKEN=${token}" >> "$GITHUB_ENV"
          echo "RECOVERY_DECODER_PATH=${GITHUB_WORKSPACE}/acceptance-bin/baykush-mrt-decoder" >> "$GITHUB_ENV"
          echo "RECOVERY_STAGING_DIR=${GITHUB_WORKSPACE}/acceptance-recovery" >> "$GITHUB_ENV"
          mkdir -p acceptance-bin acceptance-recovery acceptance-logs acceptance-evidence

      - name: Install producer dependencies
        working-directory: node
        run: npm install

      - name: Install consumer dependencies
        working-directory: citem
        run: npm ci

      - name: Apply NODE database migrations
        working-directory: node
        run: npm run db:migrate

      - name: Enable only RIPE RIS routing collection for acceptance
        working-directory: node
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL, max: 1 });
          try {
            await pool.query("UPDATE source_definitions SET enabled=false");
            const result = await pool.query(
              "UPDATE source_definitions SET enabled=true WHERE source_key='RIPE_RIS_BGP' RETURNING source_key,enabled"
            );
            if (result.rowCount !== 1 || result.rows[0]?.enabled !== true) {
              throw new Error('Failed to enable RIPE_RIS_BGP for acceptance');
            }
            console.log(result.rows[0]);
          } finally {
            await pool.end();
          }
          NODE

      - name: Build the pinned production MRT decoder
        shell: bash
        run: |
          set -euo pipefail
          docker build --target mrt-decoder-build -t baykush-mrt-decoder:node6-citem node
          decoder_container="$(docker create baykush-mrt-decoder:node6-citem)"
          trap 'docker rm -f "${decoder_container}" >/dev/null 2>&1 || true' EXIT
          docker cp "${decoder_container}:/decoder/target/release/baykush-mrt-decoder" "${RECOVERY_DECODER_PATH}"
          chmod 0755 "${RECOVERY_DECODER_PATH}"
          "${RECOVERY_DECODER_PATH}" --version

      - name: Create a real official-MRT recovered routing head
        working-directory: node
        env:
          NODE6_3_CITEM_RECOVERY_ACCEPTANCE_CONFIRMED: "true"
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/node6-3-citem-recovery-acceptance.ts | tee ../acceptance-evidence/recovery-fixture.json
          grep -q '"accepted":true' ../acceptance-evidence/recovery-fixture.json

      - name: Start NODE-6.3 API and real RIPE workers
        shell: bash
        run: |
          set -euo pipefail
          (
            cd node
            NODE_INSTANCE_ID=node63-acceptance-api PORT=18080 npm run dev:api
          ) > acceptance-logs/node-api.log 2>&1 &
          echo $! > acceptance-logs/node-api.pid

          (
            cd node
            NODE_INSTANCE_ID=node63-acceptance-measurement MEASUREMENT_TICK_MS=500 npm run dev:measurement
          ) > acceptance-logs/node-measurement.log 2>&1 &
          echo $! > acceptance-logs/node-measurement.pid

          (
            cd node
            NODE_INSTANCE_ID=node63-acceptance-recovery npm run dev:recovery
          ) > acceptance-logs/node-recovery.log 2>&1 &
          echo $! > acceptance-logs/node-recovery.pid

          (
            cd node
            NODE_INSTANCE_ID=node63-acceptance-stream STREAM_FLUSH_INTERVAL_MS=500 npm run dev:stream
          ) > acceptance-logs/node-stream.log 2>&1 &
          echo $! > acceptance-logs/node-stream.pid

      - name: Wait for NODE API
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/v1/health > acceptance-evidence/node-health.json; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "NODE API did not become healthy"
            exit 1
          fi
          cat acceptance-evidence/node-health.json

      - name: Wait for real RIPE Live plus retained MRT-recovery provenance
        shell: bash
        run: |
          set -euo pipefail
          accepted=false
          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error \
              -H "Authorization: Bearer ${BAYKUSH_NODE_API_TOKEN}" \
              -H "Accept: application/json" \
              http://127.0.0.1:18080/v1/techint/routing/status \
              > acceptance-evidence/routing-status.json; then
              if python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('acceptance-evidence/routing-status.json')
          try:
              envelope = json.loads(path.read_text())
              data = envelope['data']
              stream = data['stream']
              recovery = data['recovery']
              latest = data['latest']
              recovered = data['latestRecovered']
              ok = (
                  data['sourceKey'] == 'RIPE_RIS_BGP'
                  and data['upstreamOrigin'] == 'RIPE_RIS'
                  and stream['heartbeatFreshness'] == 'FRESH'
                  and stream['latestSessionStatus'] == 'STREAMING'
                  and int(stream['messagesObserved'] or '0') > 0
                  and int(stream['segmentsPersisted'] or '0') > 0
                  and latest is not None
                  and latest['acquisitionBasis'] == 'LIVE_STREAM'
                  and latest['acquisitionChannel'] == 'RIS_LIVE_WEBSOCKET'
                  and int(latest['updateMessages']) > 0
                  and int(latest['rrcCount']) > 0
                  and int(latest['captureProfileRrcCount'] or 0) > 0
                  and recovery['heartbeatFreshness'] == 'FRESH'
                  and recovery['latestRequestStatus'] == 'SUCCEEDED'
                  and recovered is not None
                  and recovered['acquisitionBasis'] == 'MRT_RECOVERY'
                  and recovered['acquisitionChannel'] == 'RIS_MRT_UPDATE'
                  and recovered['coverageStatus'] == 'COMPLETE'
                  and recovered['dataAvailability'] == 'AVAILABLE'
                  and recovered['liveCollectionCoverage'] == 'PARTIAL'
                  and recovered['captureProfileKey'] == 'NODE6_3_CITEM_RECOVERY_ACCEPTANCE_RRC00'
                  and int(recovered['captureProfileRrcCount'] or 0) == 1
                  and int(recovered['updateMessages']) > 0
              )
          except Exception:
              ok = False
          raise SystemExit(0 if ok else 1)
          PY
              then
                accepted=true
                break
              fi
            fi
            sleep 2
          done
          if [ "$accepted" != true ]; then
            echo "No acceptable combined RIPE Live + MRT recovered routing state was observed"
            cat acceptance-evidence/routing-status.json || true
            exit 1
          fi
          cat acceptance-evidence/routing-status.json

      - name: Run CITEM real NODE-6 consumer acceptance
        working-directory: citem
        run: npx vitest run src/lib/baykush-node/node6-live.integration.test.ts
