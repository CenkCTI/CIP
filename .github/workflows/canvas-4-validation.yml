name: CANVAS-4 validation
on:
  pull_request:
    branches:
      - main
      - feat/canvas-3-relationships-frames
    paths:
      - "src/lib/canvas/**"
      - "src/components/canvas/**"
      - "src/app/projects/**/canvas/**"
      - "src/app/api/projects/**/canvases/**"
      - "supabase/migrations/202611050080_canvas_4_media_preview.sql"
      - "tests/canvas-4-*.test.*"
      - "scripts/test-canvas4-migration.sql"
      - ".github/workflows/canvas-4-validation.yml"
  push:
    branches: [feat/canvas-4-source-media-previews]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  postgres-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f scripts/test-canvas4-migration.sql
