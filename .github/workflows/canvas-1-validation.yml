name: CANVAS-1 validation
on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/canvas/**"
      - "src/components/canvas/**"
      - "src/app/projects/**/canvas/**"
      - "src/app/api/projects/**/canvases/**"
      - "src/components/investigations/workspace-nav.tsx"
      - "supabase/migrations/202611050077_canvas_1_core_workspace.sql"
      - "tests/canvas-1-*.test.*"
      - "scripts/test-canvas1-migration.sql"
      - ".github/workflows/canvas-1-validation.yml"
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  postgres-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f scripts/test-canvas1-migration.sql
