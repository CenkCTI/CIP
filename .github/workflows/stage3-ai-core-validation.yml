name: Stage 3 AI core validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/ai/stage3/**"
      - "src/app/api/projects/**/ai/processing/**"
      - "supabase/migrations/202610160062_stage3_processing_ai_usage.sql"
      - "tests/stage3-ai-processing-core.test.ts"
      - ".github/workflows/stage3-ai-core-validation.yml"
  push:
    branches: [feat/stage3-ai-processing-core]

permissions:
  contents: read

concurrency:
  group: stage3-ai-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stage 3 security, provenance and repair tests
        run: npm test -- tests/stage3-ai-processing-core.test.ts
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Full unit suite
        run: npm test
      - name: Next.js production build
        run: npm run build
