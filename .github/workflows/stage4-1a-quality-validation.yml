name: Stage 4.1 M1A source quality validation
on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/analysis/quality/**"
      - "src/components/analysis/**"
      - "src/app/api/projects/**/analysis/quality/**"
      - "src/app/projects/**/sources/**"
      - "supabase/migrations/202611130081_stage4_1a_source_reliability_reviews.sql"
      - "tests/stage4-1a-*.test.ts"
      - "scripts/test-stage4-1a-quality-migration.sql"
      - ".github/workflows/stage4-1a-quality-validation.yml"
  push:
    branches: [feat/stage4-1a-source-reliability]
permissions:
  contents: read
jobs:
  app-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  postgres-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f scripts/test-stage4-1a-quality-migration.sql
