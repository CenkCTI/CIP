name: Phase 2.1A validation

on:
  push:
    branches:
      - feat/citem-phase-2-1a-investigation-ioc-workbench
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: phase2-1a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Production build
        run: npm run build
