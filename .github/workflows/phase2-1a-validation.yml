name: Phase 2.1A validation

on:
  push:
    branches:
      - feat/citem-phase-2-1a-investigation-ioc-workbench
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: phase2-1a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL 16
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSLo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          sudo pg_ctlcluster 16 main start || true
          sudo -u postgres createuser --superuser runner

      - name: Run all validation commands
        id: validation
        shell: bash
        run: |
          mkdir -p validation-logs
          failed=0

          run_check() {
            name="$1"
            shift
            echo "Running ${name}..."
            if "$@" >"validation-logs/${name}.log" 2>&1; then
              echo "${name}=passed" | tee -a validation-logs/summary.txt
            else
              code=$?
              echo "${name}=failed (exit ${code})" | tee -a validation-logs/summary.txt
              failed=1
            fi
          }

          run_check lint npm run lint
          run_check typecheck npm run typecheck
          run_check test npm test
          run_check build npm run build
          run_check phase2-2a-migration scripts/test-phase2-2a-migration.sh
          run_check phase2-2b-migration scripts/test-phase2-2b-migration.sh
          run_check phase2-2b1-migration scripts/test-phase2-2b1-migration.sh
          run_check phase2-2c-migration scripts/test-phase2-2c-migration.sh
          run_check phase2-2c1-migration scripts/test-phase2-2c1-migration.sh

          cat validation-logs/summary.txt
          echo "failed=${failed}" >> "$GITHUB_OUTPUT"

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-1a-validation-logs
          path: validation-logs
          if-no-files-found: error
          retention-days: 7

      - name: Enforce validation result
        if: always()
        run: |
          if [ "${{ steps.validation.outputs.failed }}" != "0" ]; then
            echo "One or more validation commands failed. Inspect the uploaded logs."
            exit 1
          fi
